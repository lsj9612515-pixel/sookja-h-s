<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홍길동 | 프론트엔드 개발자, UI 디자이너</title>
  <meta name="description" content="프론트엔드 개발과 UI 디자인 작업물을 모은 포트폴리오입니다.">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#projects">작업물로 바로 가기</a>

  <div class="layout">
    <header class="intro">
      <!-- 수정: 이름, 직무, 소개 문구 -->
      <h1>홍길동</h1>
      <p class="role">프론트엔드 개발자, UI 디자이너</p>
      <p class="lead">사용하는 사람이 헷갈리지 않는 화면을 만듭니다. 작은 인터페이스부터 서비스 전체 흐름까지 직접 설계하고 구현합니다.</p>

      <!-- 수정: 이메일과 링크 -->
      <ul class="contact">
        <li><a href="mailto:hello@example.com">hello@example.com</a></li>
        <li><a href="https://github.com/p88008542-hash" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
    </header>

    <main id="projects" class="work" tabindex="-1">
      <div class="work-head">
        <h2>작업물</h2>
        <div class="filters" role="group" aria-label="작업물 분류">
          <button type="button" data-filter="all" aria-pressed="true">전체</button>
          <button type="button" data-filter="dev" aria-pressed="false">개발</button>
          <button type="button" data-filter="design" aria-pressed="false">디자인</button>
        </div>
      </div>

      <p class="count" id="count" aria-live="polite"></p>
      <div id="project-list" class="project-list"></div>
    </main>
  </div>

  <footer class="foot">
    <p>&copy; <span id="year"></span> 홍길동</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
